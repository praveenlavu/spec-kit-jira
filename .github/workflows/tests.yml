# What this does: runs this project's own tests, checks the built wheel, scans for secrets and lints the workflow files on every push and pull request.
# When to use it: this is for the skj repository itself. Users of skj do not copy it (they copy ci/templates/ instead).
# Safe by design: it can only read the code. No Jira access; its one secret (SCRUB_DENYLIST) reaches only the history scan on a push to main.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# If you push again while a run is going, the old run stops. It saves time.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04   # pinned: Python 3.9 has no build for newer runner images
    # Fix-CI3: 90 is a diagnostic ceiling, not the target. Python 3.9 hosted took about 35 minutes (3.13 about 5); bring this back
    # down once --durations has shown why 3.9 is slow.
    timeout-minutes: 90
    strategy:
      fail-fast: false   # a failure on one Python must not cancel the other
      matrix:
        python: ["3.9", "3.13"]   # the oldest and the newest Python we support
    steps:
      - name: Get the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install skj and the test tools
        run: python -m pip install -e ".[dev]"

      # Each test sets CI itself (tests/conftest.py removes the runner's CI markers). CI is emptied here only so that
      # the few tests that need the Spec Kit CLI skip instead of fail: speckit-contract.yml runs them with it installed.
      - name: Run the tests
        env:
          CI: ""
        run: python -m pytest -q -rs --durations=40   # -rs prints each skip's reason; --durations names the slowest tests

      # From a clean copy (tracked files only), so a stray local file cannot hide a data file missing from pyproject.
      - name: Build the wheel from a clean copy and check its data files
        run: |
          rm -rf "$RUNNER_TEMP/clean" "$RUNNER_TEMP/dist" && mkdir "$RUNNER_TEMP/clean"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/clean"
          python -I -m pip wheel --no-deps -w "$RUNNER_TEMP/dist" "$RUNNER_TEMP/clean"
          python -I - "$RUNNER_TEMP/clean" "$RUNNER_TEMP"/dist/skj-*.whl <<'PY'
          import sys, zipfile
          from pathlib import Path
          src, wheels = Path(sys.argv[1]) / "src", sys.argv[2:]
          if len(wheels) != 1:
              sys.exit("expected one skj wheel, found %r" % wheels)
          names = set(zipfile.ZipFile(wheels[0]).namelist())
          for pattern in ('skj/seeds/*.json', 'skj/golden/*.json', 'skj/templates/*.md'):
              want = {p.relative_to(src).as_posix() for p in src.glob(pattern)}
              if not want or want - names:
                  sys.exit("the wheel lacks %s: %s" % (pattern, sorted(want - names) or "no such file in the tree"))
          print("the wheel carries every data file")
          PY

  scrub:
    name: Scan for secrets and private words
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get the code and its whole history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0   # the history scan reads every commit

      - name: Scan the files
        if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main')"
        run: python3 -I scripts/scrub_check.py

      # Only on a push to main: the script is then main's own, and the denylist never reaches a pull request.
      - name: Scan the files and the whole history for private words
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SCRUB_DENYLIST: ${{ secrets.SCRUB_DENYLIST }}
        run: python3 -I scripts/scrub_check.py --require-denylist --history

  actionlint:
    name: Lint the workflow files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # shortcut: the checksum file comes from the same release as the binary, so this catches a broken download, not a replaced
      # release; write the tarball's sha256 here once it has been looked up (there was no network when this was written).
      - name: Download actionlint and check its checksum
        env:
          VERSION: "1.7.7"
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/rhysd/actionlint/releases/download/v$VERSION"
          curl -fsSLO "$base/actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/actionlint_${VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "actionlint_${VERSION}_checksums.txt"
          tar -xzf "actionlint_${VERSION}_linux_amd64.tar.gz" actionlint

      - name: Lint this repository's workflows and the copy-in templates
        run: '"$RUNNER_TEMP/actionlint" .github/workflows/*.yml ci/templates/*.yml'
