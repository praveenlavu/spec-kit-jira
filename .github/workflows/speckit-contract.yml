# Every week, and whenever the manifest, the prompts or the workflow change, this installs the oldest and the newest Spec Kit we support.
# It then runs the tests that pin how this extension and workflow fit Spec Kit, so a Spec Kit release that renames something we use turns red here.
# It only reads the repository: no secrets, no Jira, no write access. A red run means "read the failing test's message", not "block a release".
name: speckit-contract

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - extension.yml
      - commands/**
      - workflows/**
      - tests/test_speckit_contract.py
      - tests/test_workflow.py
      - tests/test_manifest.py
      - tests/test_catalog.py
      - catalog/**

permissions:
  contents: read

concurrency:
  group: speckit-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Spec Kit ${{ matrix.speckit }}, Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        speckit: ["1.2.1", "latest"]
        python: ["3.9", "3.13"]
        include:
          # 1.2.1 is the minimum we support, pinned by commit (upstream release v1.2.1, the same commit the sibling toolkit's CI installs)
          # because a tag can move. "latest" has an empty ref here: the newest release tag is looked up below, the one deliberately floating entry.
          - speckit: "1.2.1"
            ref: 9dca9bf42a031765ee5e5f2371137f2f26967e11
          - speckit: "latest"
            ref: ""
    steps:
      - name: Get the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python for this kit
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install this kit and the test tools
        run: python -m pip install --quiet -e ".[dev]"
      - name: Pick the Spec Kit version to test
        env:
          REF: ${{ matrix.ref }}
        run: |
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/github/spec-kit | sed -n 's|.*refs/tags/\(v[0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' | head -n 1)
          fi
          if ! printf '%s' "$REF" | grep -Eq '^([0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$'; then
            echo "could not work out which Spec Kit version to install" >&2
            exit 1
          fi
          echo "SPECKIT_REF=$REF" >> "$GITHUB_ENV"
      # Spec Kit needs Python 3.11 or newer, so it gets its own environment (uv) and does not depend on the Python leg above.
      - name: Install Spec Kit
        run: |
          python -m pip install --quiet uv
          uv tool install specify-cli --from "git+https://github.com/github/spec-kit.git@${SPECKIT_REF}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Show the Spec Kit version
        run: specify --version
      - name: Run the contract tests
        run: |
          python -m pytest tests/test_speckit_contract.py tests/test_workflow.py tests/test_manifest.py tests/test_catalog.py -q
