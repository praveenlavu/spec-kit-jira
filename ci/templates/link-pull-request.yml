# What this does: after a pull request is merged, adds one link to it (and one comment) on the Jira story.
# When to copy it: when you want each story to point at the code that finished it. Copy it into .github/workflows/.
# Safe by design: your Jira login is given to the one step that links, and to nothing else. Running it twice adds nothing.
name: Link the pull request to Jira

on:
  pull_request:
    types: [closed]
    branches: [main]   # change "main" if your main branch has another name

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  link:
    name: Link the merged pull request
    if: github.event.pull_request.merged == true   # only when it was merged, not when it was just closed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Installed BEFORE the code is fetched, from an empty folder, in isolated mode (-I): no file of the pull request can run here.
      - name: Install skj
        run: cd "$RUNNER_TEMP" && python -I -m pip install "git+https://github.com/praveenlavu/spec-kit-jira@<COMMIT-SHA>"

      - name: Get the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}   # the code as it was merged
          fetch-depth: 0
          persist-credentials: false

      - name: Find the story key
        env:   # text from the pull request is passed in as variables, never pasted into the script
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          LC_ALL: C
        run: |
          re='(^|[^A-Za-z0-9_])([A-Z][A-Z0-9_]{1,9}-[1-9][0-9]{0,9})([^A-Za-z0-9_]|$)'
          if [[ "$BRANCH" =~ $re ]] || [[ "$TITLE" =~ $re ]]; then key="${BASH_REMATCH[2]}"; else key=""; fi
          echo "KEY=$key" >> "$GITHUB_ENV"
          if [ -n "$key" ]; then echo "Story key: $key"; else echo "::notice::No story key (like PROJ-123) in the branch name or the title."; fi

      # skj reads the Jira site name from the target branch, which it finds through origin/HEAD (a CI checkout does not set it).
      # When origin/main is in strict mode or comment approval, skj reads origin/main instead (see ci/README.md). No network.
      - name: Tell git which branch is the main branch
        env:
          BASE: ${{ github.base_ref }}
        run: git symbolic-ref refs/remotes/origin/HEAD "refs/remotes/origin/$BASE"

      - name: Add the link to the Jira story
        if: env.KEY != ''
        env:
          SKJ_EMAIL: ${{ secrets.SKJ_EMAIL }}   # the only step that gets the Jira login
          SKJ_TOKEN: ${{ secrets.SKJ_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # A merged pull request from a fork gets no secrets from GitHub: then there is nothing to log in with.
          [ -n "$SKJ_TOKEN" ] || { echo "::notice::No Jira login available (a pull request from a fork?): the link is skipped."; exit 0; }
          skj pr link "$KEY" --url "$PR_URL" --title="$TITLE" --apply   # "--title=" keeps a title like "--apply" a title
