# What this does: runs "skj gate" on each pull request and fails it when the story's checklist has gaps.
# When to copy it: when you want this check before every merge. Copy it into .github/workflows/ in your repository.
# Safe by design: it can only read the code, and by default it gets no Jira login (the comparison with Jira is skipped).
name: Check the pull request

on:
  pull_request:
    branches: [main]   # change "main" if your main branch has another name

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Check the pull request against the checklist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Installed BEFORE the code is fetched, from an empty folder, in isolated mode (-I): no file of the pull request can run here.
      - name: Install skj
        run: cd "$RUNNER_TEMP" && python -I -m pip install "git+https://github.com/praveenlavu/spec-kit-jira@<COMMIT-SHA>"

      - name: Get the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # skj compares your branch with the main branch, so it needs the full history
          persist-credentials: false

      - name: Find the story key
        env:   # text from the pull request is passed in as variables, never pasted into the script
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          LC_ALL: C
        run: |
          re='(^|[^A-Za-z0-9_])([A-Z][A-Z0-9_]{1,9}-[1-9][0-9]{0,9})([^A-Za-z0-9_]|$)'
          if [[ "$BRANCH" =~ $re ]] || [[ "$TITLE" =~ $re ]]; then key="${BASH_REMATCH[2]}"; else key=""; fi
          echo "KEY=$key" >> "$GITHUB_ENV"
          if [ -n "$key" ]; then echo "Story key: $key"; else echo "::notice::No story key (like PROJ-123) in the branch name or the title."; fi

      - name: Check the pull request against the checklist
        if: vars.SKJ_GATE_ONLINE != 'true'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Put the story key (like PROJ-123) in the branch name or the title."; exit 1; }
          skj gate "$KEY" --base "origin/$BASE" --offline --summary-out "$RUNNER_TEMP/gate-summary.md"

      - name: Check the pull request against the checklist and Jira   # optional, off by default: see ci/README.md
        if: vars.SKJ_GATE_ONLINE == 'true'
        env:
          BASE: ${{ github.base_ref }}
          SKJ_EMAIL: ${{ secrets.SKJ_EMAIL }}
          SKJ_TOKEN: ${{ secrets.SKJ_TOKEN }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Put the story key (like PROJ-123) in the branch name or the title."; exit 1; }
          git symbolic-ref refs/remotes/origin/HEAD "refs/remotes/origin/$BASE"   # skj reads the Jira site name from here
          skj gate "$KEY" --base "origin/$BASE" --summary-out "$RUNNER_TEMP/gate-summary.md"

      - name: Show the result on the run page
        if: always()
        run: if [ -f "$RUNNER_TEMP/gate-summary.md" ]; then cat "$RUNNER_TEMP/gate-summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
