# What this does: in "strict" mode, checks the strict rules and re-runs the tests at each criterion's red and green commit.
# When to copy it: only if your main branch uses strict mode. It runs the pull request's own test code, so it is kept apart.
# Safe by design: this job has NO Jira login and no secrets, and it can only read the code. Make it a required check.
name: Final check (strict mode)

on:
  pull_request:
    branches: [main]   # change "main" if your main branch has another name

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  final-check:
    name: Final check with no Jira login
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No secrets anywhere in this job, on purpose: the tests it runs come from the pull request.
    # skj refuses to run them when it sees a login-like variable (such as SKJ_TOKEN) in its environment.
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Installed BEFORE the code is fetched, from an empty folder, in isolated mode (-I): no file of the pull request can run here.
      - name: Install skj
        run: cd "$RUNNER_TEMP" && python -I -m pip install "git+https://github.com/praveenlavu/spec-kit-jira@9921b04be758376c6af9f368e35fabdc371b05e1"

      - name: Get the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # the red and green commits and the main branch are needed
          persist-credentials: false   # do not leave the GitHub token on disk, where test code could read it

      - name: Find the story key
        env:   # text from the pull request is passed in as variables, never pasted into the script
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          LC_ALL: C
        run: |
          re='(^|[^A-Za-z0-9_])([A-Z][A-Z0-9_]{1,9}-[1-9][0-9]{0,9})([^A-Za-z0-9_]|$)'
          if [[ "$BRANCH" =~ $re ]] || [[ "$TITLE" =~ $re ]]; then key="${BASH_REMATCH[2]}"; else key=""; fi
          echo "KEY=$key" >> "$GITHUB_ENV"
          if [ -n "$key" ]; then echo "Story key: $key"; else echo "::notice::No story key (like PROJ-123) in the branch name or the title."; fi

      # Both commands pass when the main branch is not in strict mode. They read the mode from the MAIN branch.
      - name: Check the strict rules
        env:
          BASE: ${{ github.base_ref }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Put the story key (like PROJ-123) in the branch name or the title."; exit 1; }
          skj strict check "$KEY" --phase pr --base "origin/$BASE"

      - name: Re-run the tests at each red and green commit
        env:
          BASE: ${{ github.base_ref }}
        run: skj strict verify "$KEY" --no-record --base "origin/$BASE"
